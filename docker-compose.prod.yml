# Production stack for the Linux VM:  docker compose -f docker-compose.prod.yml up -d --build
#
# Host networking throughout: WebRTC and TURN need real host ports, and it
# avoids Docker NAT between LiveKit and Egress. Open on the VM firewall:
#   TCP 80, 443 (Caddy)      UDP 7882 (ICE)      TCP 7881 (ICE/TCP)
#   UDP 3478 + 30000-40000 (TURN/UDP; optional, 443 alone is enough for TURN/TLS)
# .env for prod:
#   LIVEKIT_PUBLIC_URL=wss://livekit.example.com
# and edit the example.com names in infra/prod/livekit.yaml + infra/prod/caddy.yaml.
services:
  postgres:
    image: postgres:17-alpine
    network_mode: host
    command: ["postgres", "-c", "listen_addresses=localhost"]
    environment:
      POSTGRES_USER: poc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: remote_access
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U poc -d remote_access"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    network_mode: host
    command: ["redis-server", "--bind", "127.0.0.1", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:latest
    network_mode: host
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./infra/prod/livekit.yaml:/etc/livekit.yaml:ro
    depends_on: [redis]
    restart: unless-stopped

  egress:
    image: livekit/egress:latest
    network_mode: host
    cap_add: [SYS_ADMIN]
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://localhost:7880
        redis:
          address: localhost:6379
        health_port: 9090
        log_level: info
        cpu_cost:
          track_cpu_cost: 0.5
    volumes:
      - ./recordings:/out
    depends_on: [redis, livekit]
    restart: unless-stopped

  broker:
    build:
      context: .
      dockerfile: broker/Dockerfile
    network_mode: host
    environment:
      PORT: 8080
      DATABASE_URL: postgres://poc:${POSTGRES_PASSWORD}@localhost:5432/remote_access
      LIVEKIT_URL: http://localhost:7880
      LIVEKIT_WS_URL: ws://localhost:7880
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      OPERATORS: ${OPERATORS}
      ENDPOINT_SECRET: ${ENDPOINT_SECRET}
      TARGET_ALLOWLIST: ${TARGET_ALLOWLIST}
      REQUIRE_RECORDING: ${REQUIRE_RECORDING}
      RECORDINGS_DIR: /recordings
      EGRESS_OUT_DIR: /out
    volumes:
      - ./recordings:/recordings:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: livekit/caddyl4:latest     # Caddy built with the layer4 plugin (what LiveKit's own deploy uses)
    network_mode: host
    command: ["caddy", "run", "--config", "/etc/caddy.yaml", "--adapter", "yaml"]
    volumes:
      - ./infra/prod/caddy.yaml:/etc/caddy.yaml:ro
      - caddydata:/data
    restart: unless-stopped

volumes:
  pgdata:
  caddydata:
